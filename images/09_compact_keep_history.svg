    .arB { animation: arB 13s ease-in-out infinite; }
    @keyframes arBh { 0%, 42.69% { opacity: 0 } 43.46%, 96% { opacity: 1 } 100% { opacity: 0 } }
    .arBh { animation: arBh 13s ease-in-out infinite; }
    @keyframes sum { 0%, 44.62% { opacity: 0; transform: scale(0.8) } 46.37% { opacity: 1; transform: scale(1.12) } 47.31%, 96% { opacity: 1; transform: scale(1) } 100% { opacity: 0; transform: scale(0.8) } }
    .sum { animation: sum 13s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
