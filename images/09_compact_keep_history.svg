    .h3 { animation: h3 13s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes c3 { 0%, 10.92% { opacity: 0; transform: translateX(0) scale(.6) } 12.85%, 42.69% { opacity: 1; transform: translateX(0) scale(1) } 45%, 100% { opacity: 0; transform: translateX(57px) scale(.6) } }
    .c3 { animation: c3 13s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
