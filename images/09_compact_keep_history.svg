<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 588" width="1200" height="588" role="img" aria-labelledby="title desc" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Smaller context. Full history retained.</title>
  <desc id="desc">All ten entries stay in stored history while the model context is compacted to a summary of entries 1 to 7 plus recent entries 8 to 10: the summary starts in the background at 200k tokens, compaction blocks at 250k, and search_history still reads every stored entry.</desc>
  <style>
