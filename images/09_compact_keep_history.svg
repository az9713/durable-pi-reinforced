  <g class="h7"><rect x="792" y="124" width="70" height="56" rx="8" fill="#141011" stroke="#B9AAAE" stroke-width="2"/><text class="mono" x="827" y="160" text-anchor="middle" font-size="22" fill="#F3EDEE">7</text></g>
  <g class="h8"><rect x="874" y="124" width="70" height="56" rx="8" fill="#141011" stroke="#B9AAAE" stroke-width="2"/><text class="mono" x="909" y="160" text-anchor="middle" font-size="22" fill="#F3EDEE">8</text></g>
  <g class="h9"><rect x="956" y="124" width="70" height="56" rx="8" fill="#141011" stroke="#B9AAAE" stroke-width="2"/><text class="mono" x="991" y="160" text-anchor="middle" font-size="22" fill="#F3EDEE">9</text></g>
  <g class="h10"><rect x="1038" y="124" width="70" height="56" rx="8" fill="#141011" stroke="#B9AAAE" stroke-width="2"/><text class="mono" x="1073" y="160" text-anchor="middle" font-size="22" fill="#F3EDEE">10</text></g>
