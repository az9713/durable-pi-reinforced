<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t04 d04" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t04">Judge every row. Wake one agent.</title>
  <desc id="d04">Jev, a cheap classifier model, labels every production log row normal, suspicious or incident at two rows per second; code counts the verdicts, and three incidents or eight suspicious rows with one fingerprint within 120 seconds wake a durable incident agent that checks off detection through ready for review and then waits for deploy approval.</desc>
  <defs>
    <symbol id="g-pi" viewBox="0 0 64 64">
      <rect x="1.5" y="1.5" width="61" height="61" rx="12" fill="#141011" stroke="#FF5252" stroke-width="2.5"/>
      <g fill="#FFFFFF" transform="translate(16 16) scale(8)">
        <path d="M 0 0H3V2H2V1H0Z"/>
        <path d="M 0 1H1V2H2V3H1V4H0Z"/>
        <path d="M 3 2H4V4H3Z"/>
      </g>
    </symbol>
    <symbol id="g-check-o" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="13.5" fill="none" stroke="#FF5252" stroke-width="2.5"/>
      <path d="M 9.5 16.5 L14 21 L22.5 11.5" fill="none" stroke="#FF5252" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L10 5 L0 10 Z" fill="#B9AAAE"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L10 5 L0 10 Z" fill="#FF5252"/>
    </marker>
  </defs>
