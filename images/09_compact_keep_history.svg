    .c10 { animation: c10 13s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes meter { 0%, 4% { transform: scaleX(0) } 5.92%, 7.46% { transform: scaleX(0.408) } 9.38%, 10.92% { transform: scaleX(0.816) } 12.85%, 14.38% { transform: scaleX(1.224) } 16.31%, 17.85% { transform: scaleX(1.633) } 19.77%, 21.31% { transform: scaleX(2.041) } 23.23%, 24.77% { transform: scaleX(2.449) } 26.69%, 30.92% { transform: scaleX(2.857) } 32.85%, 34.38% { transform: scaleX(3.000) } 36.31%, 37.85% { transform: scaleX(3.143) } 39.77%, 45% { transform: scaleX(3.286) } 49.62%, 96% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    .meter { animation: meter 13s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes chip { 0%, 26.54% { opacity: 0 } 28.85%, 48.46% { opacity: 1 } 50.77%, 100% { opacity: 0 } }
    .chip { animation: chip 13s ease-in-out infinite; }
    @keyframes brk { 0%, 39.23% { opacity: 0 } 41.15%, 96% { opacity: 1 } 100% { opacity: 0 } }
    .brk { animation: brk 13s ease-in-out infinite; }
