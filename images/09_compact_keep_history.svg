    .arA { animation: arA 13s ease-in-out infinite; }
    @keyframes arAh { 0%, 42.69% { opacity: 0 } 43.46%, 96% { opacity: 1 } 100% { opacity: 0 } }
    .arAh { animation: arAh 13s ease-in-out infinite; }
