    .ln { animation-timing-function: linear; }
    .x { transform-box: fill-box; transform-origin: center; }
    @keyframes dev { 0%, 1% { opacity: 0; transform: translateY(8px) } 5%, 96% { opacity: 1; transform: translateY(0) } 100% { opacity: 0; transform: translateY(0) } }
